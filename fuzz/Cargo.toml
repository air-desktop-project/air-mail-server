# Crate de fuzzing d'air-mail-server (cargo-fuzz). **HORS du workspace**, et pour
# une raison précise.
#
# `cargo-fuzz` exige un nightly. Le workspace, lui, est épinglé sur stable 1.98.0
# en version exacte (cf. `../rust-toolchain.toml`). Deux toolchains dans un même
# workspace, ce sont deux LLVM — et les profils de couverture que l'un écrit,
# l'autre ne sait pas les relire. Le gate de C2 ne pourrait plus conclure.
#
# La séparation résout cela sans compromis : cette crate a son propre `Cargo.lock`,
# n'entre pas dans la mesure de couverture, ne participe pas au `Cargo.lock` du
# produit, et rien de ce qu'elle tire n'est jamais livré.
#
# Le nightly employé ici est ROULANT, et c'est acceptable ICI seulement : rien n'y
# est livré, et aucun profil de couverture n'en sort qui devrait s'accorder avec un
# autre. C'est exactement la distinction que `../rust-toolchain.toml` établit.
#
# Lancement : `cargo +nightly fuzz run <cible>` (cf. README.md).

[package]
name = "air-mail-server-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.ams-mime]
path = "../crates/ams-mime"

[dependencies.ams-proto-imap]
path = "../crates/ams-proto-imap"

[dependencies.ams-dns]
path = "../crates/ams-dns"

[dependencies.ams-dkim]
path = "../crates/ams-dkim"

[dependencies.ams-dmarc]
path = "../crates/ams-dmarc"

[dependencies.ams-proto-pop3]
path = "../crates/ams-proto-pop3"

[dependencies.ams-proto-smtp]
path = "../crates/ams-proto-smtp"

[dependencies.ams-session]
path = "../crates/ams-session"

[dependencies.ams-index]
path = "../crates/ams-index"

[dependencies.ams-config]
path = "../crates/ams-config"

[dependencies.ams-guard]
path = "../crates/ams-guard"

[dependencies.ams-auth]
path = "../crates/ams-auth"

[dependencies.ams-sasl]
path = "../crates/ams-sasl"

[dependencies.ams-spf]
path = "../crates/ams-spf"

[dependencies.ams-tls]
path = "../crates/ams-tls"

# La cible TLS appelle `start` et `start_and_complete`, qui sont des méthodes de
# TRAIT : il faut donc nommer `rustls` pour importer `SupportedKxGroup`. On ne
# nomme en revanche PAS `rustls-rustcrypto` — la source d'aléa se prend sur
# `ams_tls::provider()`, ce qui évite de recopier ici le SHA épinglé du
# fournisseur amont, c'est-à-dire un second endroit où il pourrait dériver.
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["std"]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_ams_mime_parse"
path = "fuzz_targets/fuzz_ams_mime_parse.rs"
test = false
doc = false
bench = false

