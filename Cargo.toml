# Manifeste du workspace air-mail-server.
#
# Serveur de courrier : SMTP, POP3, IMAP et HTTP. Tous les paquets vivent sous
# `crates/`. Les contraintes qui gouvernent ce découpage sont consignées dans
# `docs/contraintes.md` ; les références `C1`…`C13` ci-dessous y renvoient.
#
# LE DÉCOUPAGE EST CELUI DE LA CONTRAINTE « SANS ENTRÉE-SORTIE » (C1).
#
# Trois étages, et la frontière entre le deuxième et le troisième est la seule
# qui compte :
#
#   1. GRAMMAIRES      `ams-proto-*`, `ams-mime` — des octets vers des commandes,
#                      et retour. Aucune socket, aucun fichier, aucune horloge.
#   2. DÉCISIONS       `ams-session`, `ams-guard`, `ams-dkim`, `ams-spf`,
#                      `ams-dmarc`, `ams-tls` — des machines à états. Elles
#                      reçoivent des octets et l'heure ; elles rendent des octets
#                      et des ACTIONS. Elles n'attendent jamais.
#   3. EXÉCUTION       `ams-loop-tokio`, `ams-store` — les seules crates qui
#                      lisent, écrivent et attendent. Elles ne décident de rien.
#
# Les étages 1 et 2 sont soumis au 100 % de couverture (C2) : une machine à états
# se pilote pas à pas depuis un test, une boucle asynchrone ne se pilote pas — on
# l'attend. L'étage 3 en est hors, non par indulgence, mais parce qu'y atteindre
# 100 % exigerait de simuler des pannes du noyau, ce qui mesure la simulation.
#
# IL N'Y A AUCUNE ABSTRACTION D'EXÉCUTION (C5). Chaque moteur — tokio sur Unix,
# `air-async`/`air-uring` sur `*-linux-air` — porte sa propre boucle, qui pilote
# la MÊME machine à états. Rien à adapter, rien à maintenir entre les deux, et la
# logique du serveur n'est écrite qu'une fois.

[workspace]
resolver = "3"
members = [
    # Étage 1 — grammaires, sans entrée-sortie
    "crates/ams-mime",
    "crates/ams-proto-smtp",
    "crates/ams-sasl",
    "crates/ams-proto-pop3",
    "crates/ams-proto-imap",
    "crates/ams-proto-http",
    # Étage 2 — décisions, sans entrée-sortie
    "crates/ams-session",
    "crates/ams-guard",
    "crates/ams-tls",
    "crates/ams-dkim",
    "crates/ams-spf",
    "crates/ams-dmarc",
    "crates/ams-config",
    "crates/ams-index",
    # Étage 3 — exécution
    "crates/ams-loop-tokio",
    "crates/ams-store",
    # Binaires (C12)
    "crates/ams-server",
    "crates/ams-admin",
]

# `fuzz/` est une crate cargo-fuzz HORS de ce workspace, et pas par commodité :
# `cargo-fuzz` exige un nightly, tandis que ce workspace est épinglé sur stable
# 1.98.0 en version exacte. Deux toolchains, ce sont deux LLVM, et les profils de
# couverture que l'un écrit, l'autre ne sait pas les relire — le gate de C2 ne
# pourrait plus conclure. La crate a donc son propre `Cargo.lock`, n'entre ni dans
# la mesure de couverture ni dans le lock du produit, et rien de ce qu'elle tire
# n'est jamais livré. Lancement : `cargo +nightly fuzz run <cible>` (fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
# Version en LOCKSTEP : toutes les crates du workspace la partagent via
# `version.workspace = true`. Un seul numéro à incrémenter par release, donc
# aucune dérive possible entre les paquets.
version = "0.1.0"
edition = "2024"
# Égale au `channel` de `rust-toolchain.toml`. Les deux doivent bouger ensemble :
# ce champ fait échouer le build avec un message clair si quelqu'un compile avec
# une toolchain plus ancienne que celle sur laquelle le projet est vérifié.
rust-version = "1.98.0"
license = "MPL-2.0"
authors = ["air-mail-server contributors"]
repository = "https://github.com/air-desktop-project/air-mail-server"

[workspace.dependencies]
# Les arêtes INTERNES ne se déclarent qu'à mesure qu'elles servent : une
# dépendance posée d'avance affirmerait un assemblage qui n'existe pas.
ams-config = { path = "crates/ams-config", version = "0.1.0" }
ams-guard = { path = "crates/ams-guard", version = "0.1.0" }
ams-index = { path = "crates/ams-index", version = "0.1.0" }
ams-loop-tokio = { path = "crates/ams-loop-tokio", version = "0.1.0" }
ams-proto-smtp = { path = "crates/ams-proto-smtp", version = "0.1.0" }
ams-sasl = { path = "crates/ams-sasl", version = "0.1.0" }
ams-session = { path = "crates/ams-session", version = "0.1.0" }
ams-store = { path = "crates/ams-store", version = "0.1.0" }
ams-tls = { path = "crates/ams-tls", version = "0.1.0" }

#
# LES DÉPENDANCES EXTERNES n'entrent qu'au moment où une crate les consomme.
# C'est pourquoi cette liste s'est allongée au fil des crates écrites, et jamais
# d'avance : une dépendance posée avant son usage affirme un assemblage qui
# n'existe pas.
#
# tokio (C5) — le moteur d'entrées-sorties de la boucle Unix. PREMIÈRE dépendance
# externe du workspace.
#
# C5 tablait sur « ~25 crates transitives ». MESURÉ sur la cible Linux, avec les
# seules features qui servent : DIX, dont CINQ SEULEMENT À L'EXÉCUTION — `bytes`,
# `libc`, `mio`, `pin-project-lite`, `socket2`. Les cinq autres (`tokio-macros`,
# `proc-macro2`, `quote`, `syn`, `unicode-ident`) servent la macro `select!` :
# elles compilent pour l'HÔTE et n'entrent dans aucun binaire livré.
#
# `default-features = false` fait toute la différence, et l'estimation a été
# rectifiée dans le registre plutôt que laissée telle quelle.
#
# Pas de `rt-multi-thread` ici : le choix de l'ordonnanceur appartient au binaire
# qui lance la boucle, pas à la boucle.
#
# `libc` est déclarée EN DIRECT bien que tokio la tire déjà : `refuse_root` (C10)
# appelle `geteuid` elle-même, et une dépendance qu'on utilise se déclare, même
# quand elle est déjà là par ailleurs.
# capnp (C11) — le format du fichier de configuration. Crate PURE RUST, ZÉRO
# dépendance transitive, et compatible `no_std` avec `alloc` : elle traversera
# donc le portage vers Air sans rien exiger de plus.
#
# `default-features = false, features = ["alloc"]` : la crate `ams-config` est
# `#![no_std]`. Elle ALLOUE — construire un message Cap'n Proto le demande — et
# c'est la seule de l'étage 2 dans ce cas. Ce n'est pas une entorse à C3 : ce qui
# y est alloué vient d'un fichier écrit par l'administrateur, jamais d'un pair.
#
# L'outil C++ `capnp` n'intervient QUE pour régénérer le code committé
# (`crates/ams-config/regenerate.sh`), jamais au build ni en CI.
capnp = { version = "=0.26.0", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
libc = "0.2"

# rustls (C4) — TLS 1.3, et RIEN EN DESSOUS. Sans entrée-sortie par
# construction : il traite des tampons, pas des sockets, ce qui l'aligne sur C1.
#
# `default-features = false` N'EST PAS UNE PRÉFÉRENCE DE STYLE : la feature
# `tls12` est dans les défauts, et la laisser active ferait entrer TLS 1.2 par la
# porte de derrière, sans qu'aucune ligne de notre code ne le demande.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# Le fournisseur cryptographique PUR RUST — pas une ligne de C (C4). `aws-lc-rs`
# et `ring` en embarquent, et le portage vers Air ne peut pas payer ce prix.
#
# Dépendance `git` figée sur un SHA : la version publiée sur crates.io est
# `0.0.2-alpha` du 2024-04-24, alors que le dépôt amont est vivant. Le SHA est ce
# qui préserve la reproductibilité — et ce qui doit être revu à chaque
# changement, puisqu'une dépendance `git` échappe à `cargo audit`.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "cb967bd6427865f72e5619326c16080cbfd98e53", default-features = false, features = ["std"] }
# ML-KEM-768 (FIPS 203) — la moitié post-quantique du KEX hybride de C14. Pur
# Rust, `no_std`, sans dépendance C. EXACTEMENT la version qu'Air épingle et a
# validée contre les vecteurs FIPS 203.
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
# X25519 — l'autre moitié. Déjà tirée par `rustls-rustcrypto` ; déclarée en
# direct parce que nous l'appelons nous-mêmes.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
# tokio-rustls (C4/C5) — le pont entre la boucle et rustls, RIEN DE PLUS : il
# conduit la poignée de main sur un flux tokio, et ne décide d'aucun protocole.
#
# `default-features = false` EST ICI UNE OBLIGATION, pas une préférence : les
# défauts de cette crate sont `["logging", "tls12", "aws-lc-rs"]`. Les laisser
# ferait entrer TLS 1.2 (C6) ET du C (C4) dans la boucle, sans qu'aucune ligne
# de notre code ne le demande — deux contraintes tombées par une valeur par
# défaut. Le fournisseur, lui, vient de `ams-tls` et de nulle part ailleurs.
tokio-rustls = { version = "0.26", default-features = false }

# Lints du workspace, hérités par chaque crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# C3 — les longueurs viennent du réseau. Un décodeur qui lit un littéral IMAP
# `{4294967295}` ne doit ni allouer, ni indexer, ni boucler sur cette valeur : il
# doit la REFUSER. Une conversion qui tronque ou qui perd un signe est ici une
# faille, pas une imprécision — d'où le `deny`.
#
# Ce que ces lints NE couvrent PAS : ils voient une conversion douteuse, jamais
# une borne oubliée. Le contrôle qui manque est le fuzz de chaque décodeur, et
# il n'existe pas encore.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
arithmetic_side_effects = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
