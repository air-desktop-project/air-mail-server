# CI d'air-mail-server — vérification et gate DCO, sur runner GitHub-hosted.
#
# POURQUOI GITHUB-HOSTED, alors qu'Air tourne sur un runner self-hosted : Air a
# des crates Linux-only et des toolchains épinglées absentes des images publiques.
# Rien de tel ici — stable, zéro dépendance externe, aucune cible exotique. La
# contrainte la plus faible qui suffit.
#
# PAS DE CACHE CARGO, et c'est un choix : le workspace n'a AUCUNE dépendance
# externe. Il n'y a donc rien à mettre en cache que la compilation de nos huit
# crates, qui prend moins de temps que restaurer et sauver l'archive. Ce sera à
# reconsidérer le jour où le premier crate tiers entrera.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur une PR annule la vérification de la précédente : c'est
# le résultat du dernier état qui compte. `main` est exclu de l'annulation — on ne
# veut pas perdre le verdict d'un commit intégré.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Un avertissement non traité est une régression qui attend son heure.
  RUSTFLAGS: -D warnings

jobs:
  # ── Le gate DCO ────────────────────────────────────────────────────────────
  #
  # Séparé de la vérification du code, et volontairement : il dure quelques
  # secondes, ne compile rien, et son verdict porte sur les MESSAGES de commit.
  # Le noyer dans le job de build rendrait son échec illisible.
  dco:
    name: DCO et paternité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique COMPLET, exigé par le gate : sans lui, `origin/main`
          # n'existe pas dans le clone et la plage `base..HEAD` ne peut pas être
          # formée. Le dépôt est petit ; le coût est négligeable.
          fetch-depth: 0

      - name: Déterminer la base de comparaison
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Les commits que cette PR AJOUTE à sa branche cible.
            base="origin/${{ github.base_ref }}"
          else
            # Sur un push, l'ancien sommet de la branche. Vaut quarante zéros
            # lorsque la branche vient d'être créée : dans ce cas on laisse le
            # script résoudre lui-même, et il dira honnêtement ce qu'il a vu.
            base="${{ github.event.before }}"
            case "$base" in
              0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base" >/dev/null; then
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: check-dco
        run: ./scripts/check-dco.sh "${{ steps.base.outputs.base }}"

  # ── La vérification du code ────────────────────────────────────────────────
  verification:
    name: fmt, clippy, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Aucune action tierce d'installation de toolchain : `rust-toolchain.toml`
      # épingle la version ET ses composants, et `rustup` l'honore tout seul à la
      # première invocation de `cargo`. On le fait ici, explicitement, pour que
      # l'installation soit une étape visible plutôt qu'un effet de bord de
      # l'étape suivante — et pour que le journal affiche la version vérifiée.
      - name: Toolchain épinglée
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # `--locked` sur chaque commande : le `Cargo.lock` est committé, et une CI
      # qui le laisserait bouger en silence ne vérifierait plus le build qu'elle
      # prétend vérifier.
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  # ── Le 100 % de couverture sur ce qui ne fait pas d'entrée-sortie (C2) ─────
  #
  # Job séparé : il installe un outil, recompile tout sous instrumentation, et
  # dure donc bien plus longtemps que la vérification ordinaire. Le noyer dedans
  # rendrait cette dernière lente pour rien.
  couverture:
    name: couverture 100 % (C2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain épinglée
        run: rustup show active-toolchain

      # Binaire pré-construit plutôt que `cargo install` : ce dernier compile
      # ~250 crates à chaque exécution, pour un outil dont la version n'a aucune
      # raison de varier d'un job à l'autre.
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: check-couverture
        run: ./scripts/check-couverture.sh

  # ── Smoke-fuzz borné (C3) ─────────────────────────────────────────────────
  #
  # UN DÉTECTEUR DE RÉGRESSION, PAS UNE CAMPAGNE. Quelques secondes par cible
  # depuis un corpus neuf n'explorent pas ce que des heures explorent ; ce job
  # attrape la panique qu'un changement vient d'introduire sur un chemin déjà
  # connu, et rien de plus. Une vraie campagne se lance à la main (fuzz/README).
  #
  # Le nightly employé ici est ROULANT, à rebours du pin exact du workspace — et
  # c'est acceptable ICI seulement : `fuzz/` vit hors du workspace, rien n'en est
  # livré, et aucun profil de couverture n'en sort qui doive s'accorder avec un
  # autre. C'est exactement la distinction que `rust-toolchain.toml` établit.
  fuzz:
    name: smoke-fuzz (C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `fuzz/` est hors du workspace, donc `cargo fmt --all` du job de
      # vérification ne l'atteint pas. Le pin du dépôt s'y applique quand même —
      # rustup remonte l'arborescence — donc un seul rustfmt pour tout le dépôt.
      - name: cargo fmt (fuzz)
        working-directory: fuzz
        run: cargo fmt -- --check

      - name: Nightly, pour cargo-fuzz seulement
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@cargo-fuzz

      # Le corpus versionné (`seeds/`) est passé en LECTURE : sans lui, une
      # campagne de quinze secondes repartirait de zéro et passerait son temps à
      # redécouvrir qu'un message commence par un nom de champ.
      - name: fuzz_ams_mime_parse
        working-directory: fuzz
        run: |
          # libFuzzer EXIGE que le premier répertoire de corpus existe : il n'y
          # écrit que s'il peut l'ouvrir, et refuse de démarrer sinon. cargo-fuzz
          # ne le crée que lorsqu'on ne lui en nomme aucun.
          mkdir -p corpus/fuzz_ams_mime_parse
          cargo +nightly fuzz run fuzz_ams_mime_parse \
            corpus/fuzz_ams_mime_parse seeds -- -max_total_time=20

      - name: fuzz_ams_mime_limits
        working-directory: fuzz
        run: |
          mkdir -p corpus/fuzz_ams_mime_limits
          cargo +nightly fuzz run fuzz_ams_mime_limits \
            corpus/fuzz_ams_mime_limits seeds -- -max_total_time=20
