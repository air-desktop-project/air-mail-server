[package]
name = "ams-api"
# **EN LOCKSTEP COMME LES AUTRES.** Cette crate portait son numéro en dur, et
# le commentaire du workspace affirmait pourtant que « toutes les crates la
# partagent via `version.workspace = true` ». Une seule ne le faisait pas —
# assez pour que la montée en 0.2.0 laisse derrière elle une crate en 0.1.0.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L'API REST : ce qu'une requête désigne, et le droit qu'elle demande — sans entrée-sortie"

[dependencies]
ams-proto-http = { workspace = true }
# `HMAC-SHA-256` et sa comparaison à temps constant vivent dans `ams-sasl`
# depuis le 2026-09-22 : SCRAM en a besoin aussi, et deux copies d'une
# construction cryptographique divergent un jour.
ams-sasl = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
