[package]
name = "ams-session"
description = "Machines à états des sessions serveur, sans entrée-sortie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ams-proto-pop3 = { workspace = true }
# IMAP (RFC 9051) : la session tient les quatre états, la grammaire découpe.
ams-proto-imap = { workspace = true }
ams-proto-smtp = { workspace = true }
ams-sasl = { workspace = true }
# SPF (C9) pour un seul type : `Verdict`. La session ne l'évalue pas — elle en
# décide. Redéfinir l'énumération ici en ferait deux, et deux énumérations pour
# une seule notion finissent par diverger d'un bras.
ams-spf = { workspace = true }


[lints]
workspace = true
