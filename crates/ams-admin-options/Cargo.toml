[package]
name = "ams-admin-options"
description = "La grammaire de la ligne de commande d'air-mail-admin, sans entrée-sortie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# LA GRAMMAIRE DES ANNONCES, ET NON SA COPIE. L'alphabet d'un nom de service et
# les deux noms réservés appartiennent au protocole `air-service-locator` ; les
# recopier ici en ferait deux lectures, dont une finirait par mentir. Cette
# crate refuse donc à la ligne de commande ce que l'annuaire refuserait au
# premier message — devant l'administrateur, et non dans un journal.
ams-asl = { workspace = true }
# `asl-proto` POUR UN SEUL TYPE : le protocole d'un point, que `ams-asl` attend
# dans ses déclarations. Rien de neuf dans le graphe — `ams-asl` le tire déjà.
asl-proto = { workspace = true }
ams-config = { workspace = true }
ams-guard = { workspace = true }
ams-proto-imap = { workspace = true }
ams-proto-smtp = { workspace = true }

[dev-dependencies]
# Uniquement pour les essais : ils confrontent la reprise que ces options
# décrivent à celle que la file emploie réellement.
ams-queue = { workspace = true }

[lints]
workspace = true
