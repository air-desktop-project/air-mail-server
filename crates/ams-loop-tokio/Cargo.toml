[package]
name = "ams-loop-tokio"
description = "Boucle d'entrées-sorties Unix, sur tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ams-proto-pop3 = { workspace = true }
ams-proto-smtp = { workspace = true }
ams-guard = { workspace = true }
ams-session = { workspace = true }
# SPF (C9) : la boucle CONDUIT l'évaluation — elle seule a le droit d'attendre
# une réponse DNS — mais elle n'en décide rien.
ams-spf = { workspace = true }
# Le codec DNS. La boucle parle au résolveur ; le format, lui, s'éprouve à
# l'étage 1.
ams-dns = { workspace = true }
# DKIM (C9) : la boucle conduit la vérification — elle seule a le droit
# d'attendre une clé — mais elle n'en décide rien.
ams-dkim = { workspace = true }
# DMARC (C9) : c'est le seul endroit où un message est refusé pour ce qu'il
# prétend être.
ams-dmarc = { workspace = true }
# Le squelette d'un message : la boucle doit découper un bloc d'en-tête en
# champs pour savoir lesquels une signature couvre.
ams-mime = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
# `rustls` est nommée pour un SEUL type : `ServerConfig`, qui figure dans la
# signature publique. La boucle ne construit aucun fournisseur — celui-ci vient
# de `ams-tls`, et l'appelant le lui apporte tout fait.
rustls = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# `macros` et `rt-multi-thread` ne servent qu'aux tests : le choix de
# l'ordonnanceur appartient au binaire, pas à la bibliothèque.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
# Les tests montent un vrai serveur TLS : il leur faut le fournisseur du produit,
# pas un autre. Une dépendance de TEST seulement — la boucle, elle, reste
# ignorante du fournisseur qu'on lui donne.
ams-tls = { workspace = true }
# La politique de test authentifie : il lui faut le type des identifiants.
ams-sasl = { workspace = true }


[lints]
workspace = true
