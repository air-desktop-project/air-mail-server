[package]
name = "ams-admin"
description = "L'outil de contrôle et de configuration d'air-mail-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Nom distinct de celui du serveur (C12), et seul moyen de produire ou de lire un
# fichier de configuration, qui est binaire (C11).
[[bin]]
name = "air-mail-admin"
path = "src/main.rs"

[dependencies]
ams-api = { workspace = true }
# `Method` vient de là : le document OpenAPI nomme les verbes que
# `Resource::allowed` rend, et ce sont les mêmes valeurs que le serveur route.
ams-proto-http = { workspace = true }
ams-auth = { workspace = true }
# `SIGPIPE` : un outil dont la sortie passe dans un tube ne doit pas paniquer
# quand le lecteur ferme. Rust l'ignore au démarrage ; on rend le défaut d'Unix.
libc = { workspace = true }
ams-admin-options = { workspace = true }
ams-fichier = { workspace = true }
ams-config = { workspace = true }
# La clef VAPID de Web Push : la créer et en dire la moitié publique.
ams-push = { workspace = true }
ams-guard = { workspace = true }
ams-queue = { workspace = true }
ams-index = { workspace = true }
ams-proto-imap = { workspace = true }
ams-proto-smtp = { workspace = true }
ams-store = { workspace = true }

# ── S'ANNONCER AUPRÈS D'UN ANNUAIRE `air-service-locator` ───────────────────
#
# `asl enroll` est le SEUL verbe de cet outil qui parle au réseau, et c'est ce
# qui fait entrer ces six-là. Il lie une clé neuve à cette machine : la clé est
# générée ici, sa moitié privée ne sort pas, et l'annuaire n'en connaît que la
# moitié publique (C14 : aucun secret partagé).
#
# `ams-asl` compose la fiche, `ams-quic-dial` porte la connexion, `ams-tls` la
# confiance — ni autorité ni nom, une clé. `asl-client` compose la preuve de
# possession, `asl-cle` lit le code et le défi, `asl-id` nomme les
# identifiants, `asl-racines` donne les racines embarquées et leurs adresses.
ams-asl = { workspace = true }
ams-quic-dial = { workspace = true }
ams-tls = { workspace = true }
asl-client = { workspace = true }
asl-cle = { workspace = true }
asl-id = { workspace = true }
asl-racines = { workspace = true }
# UN EXÉCUTEUR POUR UN SEUL VERBE. Le reste de cet outil est synchrone, et le
# reste. `new_current_thread` : un enrôlement est un aller-retour, pas une
# charge — un ordonnanceur à plusieurs fils serait du poids pour rien.
tokio = { workspace = true }

# `Credentials` n'est pas dans les dépendances de l'outil : il HACHE des mots de
# passe, il n'en vérifie aucun. Les essais, eux, doivent vérifier — c'est toute
# la question qu'ils posent au magasin qu'ils viennent d'écrire.
[dev-dependencies]
ams-sasl = { workspace = true }
# Les essais de SCRAM OUVRENT le scellé que l outil vient d écrire : sans cela,
# un magasin bien formé et vide de sens passerait pour bon.
ams-auth = { workspace = true }
ams-config = { workspace = true }
# La migration `scram bind` s'éprouve sur un magasin tel que la 0.2.15
# l'écrivait — scellé sous le seul login —, et aucune fonction publique ne sait
# plus en fabriquer un : l'essai le scelle lui-même.
chacha20poly1305 = { workspace = true }

[lints]
workspace = true
