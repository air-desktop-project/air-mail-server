[package]
name = "ams-server"
description = "Le serveur air-mail-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Le binaire ne porte PAS le nom de la crate (C12) : c'est `air-mail-server` qui
# s'installe et qui se lance, et c'est ce nom-là que l'administrateur connaît.
[[bin]]
name = "air-mail-server"
path = "src/main.rs"

[dependencies]
ams-config = { workspace = true }
ams-guard = { workspace = true }
ams-index = { workspace = true }
ams-loop-tokio = { workspace = true }
ams-proto-pop3 = { workspace = true }
ams-proto-smtp = { workspace = true }
ams-session = { workspace = true }
ams-store = { workspace = true }
ams-auth = { workspace = true }
ams-sasl = { workspace = true }
ams-tls = { workspace = true }
# `rustls` n'est nommée que pour le TYPE `ServerConfig`, que `ams-tls` construit
# et que la boucle consomme. Ce binaire n'en appelle aucune fonction.
rustls = { workspace = true }
# `rt-multi-thread` : le binaire CHOISIT son ordonnanceur, et il lui en faut un
# multi-fils — `block_in_place`, dont la remise Maildir a besoin pour ses `fsync`,
# n'existe pas sur l'ordonnanceur mono-fil.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

[lints]
workspace = true
